limit_req_zone $binary_remote_addr zone=workspace_requests:10m rate=10r/s;
server {
    listen 8080;
    server_name _;
    client_max_body_size 64k;
    server_tokens off;
    location / {
        limit_req zone=workspace_requests burst=30 nodelay;
        proxy_pass http://agentshield:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 1100s;
    }
}
