# Optional deployment. Only the dashboard/API port is published, on host loopback.
# The receiver shares this container's namespace and has no published port.
services:
  agentshield:
    build: .
    networks:
      - isolated
    read_only: true
    tmpfs:
      - /tmp
    environment:
      AGENTSHIELD_DB: sqlite:////data/agentshield.db
      AGENTSHIELD_LAB_ROOT: /data/lab
      AGENTSHIELD_ENABLE_REAL_MODEL: "0"
    volumes:
      - type: bind
        source: ${AGENTSHIELD_DATA_DIR:-./data}
        target: /data
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports:
      - "127.0.0.1:8780:8080"
    networks:
      - edge
      - isolated
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      agentshield:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
networks:
  isolated:
    internal: true
  edge:
